name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  security:
    name: Run security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements-dev.txt
      - name: Run bandit
        run: bandit -r . -ll
      - name: Run safety
        run: safety check -r requirements-dev.txt --full-report
      - name: Run semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/ci"

  pip-audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt