name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  security:
    name: Run security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
