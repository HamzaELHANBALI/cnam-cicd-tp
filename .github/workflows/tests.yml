name: test-victor

on:
  push:
    branches: [main]
  pull_request:
    # branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Clone the repository to the runner

      - name: Set up Python
        uses: actions/setup-python@v5 # install Python on the runner
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -v

        #commantaire
