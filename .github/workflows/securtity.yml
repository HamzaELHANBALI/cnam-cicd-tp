name: Security

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  security:
    name: Run security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUb_TOKEN: ${{ secrets.GITHUB_TOKEN }}