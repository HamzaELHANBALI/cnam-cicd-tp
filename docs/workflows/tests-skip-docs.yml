name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  tests:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer pytest
        run: pytest -v
